<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf2f1">
  <title>Say It for Shotaro</title>
  <meta name="description" content="Little words for every Shotaro moment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="say-it">SAY IT FOR</p>
      <h1>SHOTARO <span>♡</span></h1>
      <p class="tagline">little words for every Shotaro moment.</p>
    </header>

    <section class="generator" aria-label="Shotaro comment generator">
      <div class="bear-card" aria-live="polite">
        <div class="ear ear-left" aria-hidden="true"></div>
        <div class="ear ear-right" aria-hidden="true"></div>
        <p id="comment">Your comment<br>will appear here.</p>
      </div>

      <button class="primary" id="generateBtn" type="button">GET A LINE</button>
      <button class="secondary" id="copyBtn" type="button" disabled>
        <span aria-hidden="true">▢</span> COPY
      </button>
      <p class="status" id="status" aria-live="polite"></p>
    </section>

    <footer>
      <div class="footer-mark"><span></span><b>♡</b><span></span></div>
      <p>MADE WITH ♡ FOR SHOTARO</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
